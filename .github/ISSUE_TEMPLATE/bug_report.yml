name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal steps, workflow snippet or Terraform config.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: hatchrun release, image name and Terraform module version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant scaler or agent output. Remove secrets and tokens.
      render: text
